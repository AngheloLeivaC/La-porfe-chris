name: Deploy Frontend to cPanel via SSH

on:
  push:
    branches:
      - main # o master dependiendo del nombre de tu rama principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Angular 17 funciona bien con Node 18 o 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular Project
        run: npm run build

      - name: Deploy to Server via SSH/SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # En Angular 17 (application builder), la build va dentro de la subcarpeta 'browser/'
          source: "dist/laprofechris-angular/browser/*"
          target: ${{ secrets.SSH_REMOTE_PATH_FRONTEND }}
          strip_components: 3 # Quita "dist/laprofechris-angular/browser/" de la ruta de destino
          rm: true # Opcional: elimina los archivos anteriores antes de subir los nuevos
