<section id="metodologia" class="value-props">
  <div class="container value-props-grid">
    <div
      class="value-card"
      *ngFor="let v of content.valueProps; let i = index"
      appScrollReveal
      [revealDelay]="i * 120"
    >
      <div class="value-icon" [style.background]="v.bg">
        <svg *ngIf="v.icon === 'book'" width="26" height="26" viewBox="0 0 24 24" fill="none" [attr.stroke]="v.colorVar" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
        </svg>
        <svg *ngIf="v.icon === 'bolt'" width="26" height="26" viewBox="0 0 24 24" fill="none" [attr.stroke]="v.colorVar" stroke-width="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
        </svg>
        <svg *ngIf="v.icon === 'chat'" width="26" height="26" viewBox="0 0 24 24" fill="none" [attr.stroke]="v.colorVar" stroke-width="2">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
        </svg>
      </div>
      <h3 class="value-title">{{ v.title }}</h3>
      <p class="value-text">{{ v.text }}</p>
    </div>
  </div>
</section>
