<section id="cursos" class="courses">
  <div class="container">
    <div class="courses-lang-row" appScrollReveal>
      <p class="courses-eyebrow">Nuestros Programas</p>
      <div class="courses-lang-tabs" role="tablist" aria-label="Elegir idioma">
        <button
          type="button"
          *ngFor="let tab of content.languageTabs"
          class="courses-lang-tab"
          [class.active]="selectedLanguage === tab.id"
          role="tab"
          [attr.aria-selected]="selectedLanguage === tab.id"
          (click)="selectLanguage(tab.id)"
        >
          <span class="courses-lang-flag" aria-hidden="true">{{ tab.flag }}</span>
          {{ tab.label }}
        </button>
      </div>
    </div>

    <div class="courses-header">
      <h2 class="courses-title">{{ sectionTitle }}</h2>
      <a href="#cursos" class="courses-link">
        Ver todos los niveles
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="13 17 18 12 13 7" />
          <polyline points="6 17 11 12 6 7" />
        </svg>
      </a>
    </div>

    <div class="courses-grid" *ngIf="filteredCourses.length; else sinCursos">
      <div
        class="course-card"
        *ngFor="let c of filteredCourses; let i = index"
        appScrollReveal
        [revealDelay]="i * 120"
      >
        <div class="course-image-wrap">
          <img [src]="c.img" [alt]="c.title" class="course-image" />
          <div class="course-badge" [style.background]="c.badgeColor">{{ c.level }}</div>
        </div>
        <div class="course-body">
          <div class="course-title-row">
            <h4 class="course-title">{{ c.title }}</h4>
            <span class="course-price">{{ c.price }}</span>
          </div>
          <p class="course-text">{{ c.text }}</p>
          <hr class="course-divider" />
          <div class="course-footer">
            <div class="course-weeks">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="9" />
                <polyline points="12 7 12 12 16 14" />
              </svg>
              {{ c.weeks }}
            </div>
            <button class="btn-small">Más Info</button>
          </div>
        </div>
      </div>
    </div>

    <ng-template #sinCursos>
      <div class="courses-empty">
        <p>Próximamente vamos a agregar cursos en este idioma. ¡Vuelve pronto! 🎉</p>
      </div>
    </ng-template>
  </div>
</section>
