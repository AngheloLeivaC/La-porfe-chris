<div class="chatbot-wrapper">
  <!-- Panel de chat -->
  <div class="chat-panel" *ngIf="open">
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="chat-avatar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
          </svg>
        </div>
        <div>
          <p class="chat-title">Asistente La Profe Chris</p>
          <p class="chat-subtitle">
            <span class="chat-status-dot"></span> En línea
          </p>
        </div>
      </div>
      <button class="chat-close-btn" (click)="closeChat()" aria-label="Cerrar chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>

    <div class="chat-body">
      <div
        class="chat-bubble"
        [ngClass]="m.from"
        *ngFor="let m of messages"
      >
        {{ m.text }}
      </div>

      <div class="chat-bubble bot typing" *ngIf="isTyping">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <div #scrollAnchor></div>
    </div>

    <div class="chat-options" *ngIf="currentOptions.length && !isTyping">
      <button
        class="chat-option-btn"
        *ngFor="let opt of currentOptions"
        (click)="selectOption(opt)"
      >
        {{ opt.label }}
      </button>
    </div>

    <div class="chat-footer">
      <button class="chat-restart-btn" (click)="restart()">↺ Reiniciar conversación</button>
    </div>
  </div>

  <!-- Botón flotante -->
  <button class="chat-fab" (click)="toggleChat()" [class.is-open]="open" aria-label="Abrir chat">
    <span class="chat-fab-badge" *ngIf="hasNewMessage && !open">1</span>
    <svg *ngIf="!open" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
    </svg>
    <svg *ngIf="open" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
      <line x1="18" y1="6" x2="6" y2="18" />
      <line x1="6" y1="6" x2="18" y2="18" />
    </svg>
  </button>
</div>
