<div class="promo-backdrop" *ngIf="visible" (click)="close()">
  <div class="promo-card" (click)="$event.stopPropagation()">
    <button type="button" class="promo-close" (click)="close()" aria-label="Cerrar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>

    <div class="promo-decor" aria-hidden="true">
      <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
        <circle cx="0" cy="0" r="45" fill="white" />
        <circle cx="100" cy="100" r="55" fill="white" />
      </svg>
    </div>

    <span class="promo-badge">{{ content.promoOffer.badge }}</span>
    <h2 class="promo-title">{{ content.promoOffer.title }}</h2>
    <p class="promo-subtitle">{{ content.promoOffer.subtitle }}</p>

    <button type="button" class="promo-cta" (click)="claim()">
      {{ content.promoOffer.ctaLabel }}
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="5" y1="12" x2="19" y2="12" />
        <polyline points="12 5 19 12 12 19" />
      </svg>
    </button>

    <button type="button" class="promo-skip" (click)="close()">Ahora no, gracias</button>
  </div>
</div>
