<div class="stripe-modal-overlay" (click)="close()">
  <div class="stripe-modal" (click)="$event.stopPropagation()">

    <button class="stripe-modal-close" (click)="close()" aria-label="Cerrar" [disabled]="submitting()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>

    <div *ngIf="paidSuccessfully()" class="stripe-modal-success">
      <div class="stripe-success-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5" />
        </svg>
      </div>
      <p class="stripe-success-title">¡Pago realizado!</p>
      <p class="stripe-success-text">Tu curso ya está disponible en "Mis Cursos".</p>
    </div>

    <ng-container *ngIf="!paidSuccessfully()">
      <div class="stripe-modal-steps">
        <span class="stripe-step stripe-step--done">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </span>
        <span class="stripe-step-line"></span>
        <span class="stripe-step stripe-step--active">2</span>
        <span class="stripe-step-label">Paso 2 de 2 · Pago</span>
      </div>

      <p class="stripe-modal-title">Pagar con tarjeta</p>

      <div class="stripe-order-summary" *ngIf="itemLabel || totalLabel">
        <div class="stripe-order-info">
          <span class="stripe-order-label" *ngIf="itemLabel">Estás pagando</span>
          <span class="stripe-order-title" *ngIf="itemLabel">{{ itemLabel }}</span>
        </div>
        <span class="stripe-order-price" *ngIf="totalLabel">{{ totalLabel }}</span>
      </div>

      <div *ngIf="loadingForm()" class="stripe-modal-loading">
        <span class="stripe-spinner"></span>
        Cargando formulario de pago...
      </div>

      <div #paymentElementRef class="stripe-payment-element" [class.stripe-hidden]="loadingForm()"></div>

      <div *ngIf="errorMessage()" class="stripe-modal-alert">
        {{ errorMessage() }}
      </div>

      <button
        class="stripe-pay-btn"
        *ngIf="!loadingForm()"
        [disabled]="submitting()"
        (click)="pagar()"
      >
        <span class="stripe-spinner" *ngIf="submitting()"></span>
        <svg *ngIf="!submitting()" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="10" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" />
        </svg>
        <span>{{ submitting() ? 'Procesando...' : 'Confirmar pago' }}</span>
      </button>

      <p class="stripe-secure-note">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="10" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" />
        </svg>
        Pago procesado de forma segura por Stripe
      </p>
    </ng-container>

  </div>
</div>
