<div class="pf">
  <label class="pf-label" [for]="inputId">{{ label }}</label>

  <div class="pf-box" [class.pf-box--error]="invalid">
    <svg class="pf-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="11" width="16" height="10" rx="2" />
      <path d="M8 11V7a4 4 0 0 1 8 0v4" />
    </svg>

    <input
      #input
      class="pf-input"
      [id]="inputId"
      [type]="visible() ? 'text' : 'password'"
      [formControl]="control"
      [attr.autocomplete]="autocomplete"
      [placeholder]="placeholder"
      [attr.aria-invalid]="invalid"
      autocapitalize="off"
      spellcheck="false"
    />

    <button
      type="button"
      class="pf-eye"
      (click)="toggle()"
      [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      [attr.aria-pressed]="visible()"
    >
      <svg *ngIf="!visible()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
      <svg *ngIf="visible()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1" />
        <path d="M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 4.4-1" />
        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
        <path d="m3 3 18 18" />
      </svg>
    </button>
  </div>

  <div class="pf-msgs" aria-live="polite">
    <ng-content></ng-content>
  </div>
</div>
