<div class="meter" *ngIf="show !== 'checklist' && result.level !== 'empty'">
  <div class="meter-bar" [attr.data-level]="result.level" aria-hidden="true">
    <span class="seg" [class.seg--on]="filled >= 1"></span>
    <span class="seg" [class.seg--on]="filled >= 2"></span>
    <span class="seg" [class.seg--on]="filled >= 3"></span>
  </div>
  <span class="meter-label" [attr.data-level]="result.level">
    Seguridad: {{ result.label }}
  </span>
</div>

<ul class="checks" *ngIf="show !== 'meter'">
  <li *ngFor="let c of result.checks" class="check" [class.check--ok]="c.passed">
    <span class="check-dot" aria-hidden="true">
      <svg *ngIf="c.passed" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m5 12.5 4.5 4.5L19 7.5" />
      </svg>
    </span>
    <span class="check-text">
      {{ c.label }}
      <em class="check-tag">{{ c.required ? 'obligatorio' : 'recomendado' }}</em>
    </span>
    <span class="sr-only">{{ c.passed ? '(cumplido)' : '(pendiente)' }}</span>
  </li>
</ul>
