<!-- Overlay para cerrar el sidebar en mobile al tocar afuera -->
<div class="sidebar-overlay" *ngIf="mobileOpen" (click)="closeMobile.emit()"></div>

<aside
  class="aula-sidebar"
  [class.aula-sidebar--open]="mobileOpen"
  [class.aula-sidebar--expanded]="expanded()"
>

  <nav class="sidebar-nav">
    <button
      *ngFor="let item of items"
      type="button"
      class="sidebar-item"
      [class.sidebar-item--active]="active === item.id"
      (click)="select(item.id)"
    >
      <span class="sidebar-icon">
        <!-- Mis Cursos -->
        <svg *ngIf="item.id === 'mis-cursos'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z" />
          <path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20" />
        </svg>
        <!-- Certificaciones -->
        <svg *ngIf="item.id === 'certificaciones'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="5" />
          <path d="m8.5 12.5-1.5 8 5-2.5 5 2.5-1.5-8" />
        </svg>
        <!-- Marketplace -->
        <svg *ngIf="item.id === 'marketplace'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8h16l-1.5 10.5a2 2 0 0 1-2 1.5H7.5a2 2 0 0 1-2-1.5L4 8Z" />
          <path d="M8 8V6a4 4 0 0 1 8 0v2" />
        </svg>
        <!-- Exámenes -->
        <svg *ngIf="item.id === 'examenes'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3 8-8" />
          <path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9" />
        </svg>
        <!-- Calendario -->
        <svg *ngIf="item.id === 'calendario'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="2" />
          <path d="M3 10h18M8 3v4M16 3v4" />
        </svg>
      </span>
      <span class="sidebar-label">{{ item.label }}</span>
    </button>
  </nav>

</aside>
